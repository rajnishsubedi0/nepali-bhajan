name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------- Decode keystore ----------
      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo -n "$SIGNING_KEY" | base64 -d > ${{ github.workspace }}/my-upload-key.jks
          echo "=== Decoded keystore ==="
          ls -la ${{ github.workspace }}/my-upload-key.jks
          file ${{ github.workspace }}/my-upload-key.jks
          sha256sum ${{ github.workspace }}/my-upload-key.jks

      # ---------- Debug: verify keystore + passwords ----------
      - name: Debug keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          JKS="${{ github.workspace }}/my-upload-key.jks"
          echo "=== Secret lengths (chars) ==="
          echo "STORE_PASSWORD length: ${#STORE_PASSWORD}"
          echo "KEY_PASSWORD length:   ${#KEY_PASSWORD}"
          echo "KEY_ALIAS:             [$KEY_ALIAS]"

          echo ""
          echo "=== Test 1: list keystore with STORE_PASSWORD ==="
          keytool -list -keystore "$JKS" -storepass "$STORE_PASSWORD" 2>&1 | head -20 || true

          echo ""
          echo "=== Test 2: list keystore with STORE_PASSWORD + alias ==="
          keytool -list -keystore "$JKS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 | head -20 || true

          echo ""
          echo "=== Test 3: read private key with KEY_PASSWORD ==="
          keytool -list -keystore "$JKS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" 2>&1 | head -20 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------- Build release APK ----------
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # ---------- Collect APK ----------
      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} artifacts/bhajanapp-${{ github.ref_name }}.apk \;
          ls -la artifacts/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: artifacts/*.apk
          retention-days: 30

      # ---------- Publish Release ----------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
